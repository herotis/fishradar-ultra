<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#070d1c;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}
.app{max-width:440px;margin:0 auto;padding:10px;padding-bottom:80px}
.header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#0f1a32;border-radius:20px;border:1px solid #1e2d55;margin-bottom:12px;position:sticky;top:10px;z-index:10;backdrop-filter:blur(12px)}
.logo{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#0a1628;flex-shrink:0}
.h-title{font-weight:900;font-size:17px;line-height:1.1} .h-sub{font-size:11px;color:#8aa0c8;letter-spacing:1.5px}
.h-time{margin-left:auto;text-align:right;font-size:11px;color:#6b84af;line-height:1.3}
.top3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:#121f3a;border:1px solid #1e2d55;border-radius:18px;padding:12px;text-align:center}
.card .lbl{font-size:10px;color:#8aa0c8;margin-bottom:3px} .card .val{font-size:20px;font-weight:900} .card .sub{font-size:9px;color:#6b84af;margin-top:2px}
.wind{color:#22d3ee} .wave{color:#60a5fa} .rain{color:#a78bfa}
.tide-box{background:#0f1a32;border:1px solid #1e2d55;border-radius:20px;padding:14px 12px 8px 12px;margin-bottom:12px;overflow:hidden}
.tide-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tide-title{font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.tide-loc{font-size:10px;color:#6b84af}
.tide-chart{position:relative;width:100%;height:86px;}
.tide-canvas{width:100%;height:86px;display:block}
.tide-times{display:flex;justify-content:space-between;font-size:9px;color:#5a6f96;padding:2px 4px}
.tide-stats{display:flex;gap:8px;margin-top:8px}
.tide-stat{flex:1;background:#101c34;border:1px solid #1c2b4e;border-radius:12px;padding:8px;text-align:center}
.tide-stat b{display:block;font-size:13px} .tide-stat span{font-size:9px;color:#6b84af}
.high{color:#34d399} .low{color:#f87171}
.moon-box{display:flex;align-items:center;gap:10px;background:#101c34;border:1px solid #1c2b4e;border-radius:14px;padding:10px 12px;margin-top:10px}
.moon-icon{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #e2e8f0 0%, #94a3b8 60%, #475569 100%);position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 0 12px rgba(226,232,240,0.3)}
.moon-phase-text{font-size:14px;font-weight:800} .moon-sub{font-size:10px;color:#6b84af}

.day{background:#0f1a32;border:1px solid #1e2d55;border-radius:18px;margin-bottom:8px;overflow:hidden;transition:all 0.2s}
.day-head{display:flex;justify-content:space-between;align-items:center;padding:14px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;position:relative}
.day-head:active{background:rgba(255,255,255,0.04)}
.day-head b{font-size:13px;pointer-events:none} 
.pills{display:flex;gap:5px;align-items:center;pointer-events:none}
.pill{font-size:10px;background:#1a2747;padding:3px 7px;border-radius:999px;border:1px solid #24365f}
.chevron{margin-left:8px;font-size:12px;transition:transform 0.25s;color:#6b84af;pointer-events:none}
.day.open .chevron{transform:rotate(180deg)}
.slots{padding:0 6px 6px 6px;display:none} 
.day.open .slots{display:block;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)}}
.row{display:flex;align-items:center;gap:8px;background:#101c34;border:1px solid #1c2b4e;border-radius:12px;padding:10px 10px;margin-bottom:5px}
.row.warn{border-left:3px solid #f59e0b} .row.danger{border-left:3px solid #ef4444}
.t{width:40px;font-weight:800;font-size:16px;text-align:center;flex-shrink:0} .t small{display:block;font-size:9px;font-weight:400;color:#6b84af}
.arrow{width:30px;height:30px;border-radius:50%;background:#0d1a33;border:1px solid #1e2d55;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.kt{font-weight:900;font-size:17px;color:#22d3ee;min-width:62px} .wv{min-width:52px;font-size:12px} .rn{margin-left:auto;min-width:56px;text-align:right}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700} .b-rain{background:#1e1b4b;color:#a5b4fc;border:1px solid #312e81} .b-dry{color:#475569}
.loading{text-align:center;padding:30px;color:#6b84af;font-size:13px}
</style>

<script>
const LAT=7.8475, LON=98.3481;
const WEATHER_API=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=wind_speed_10m,wind_direction_10m,precipitation,wave_height&daily=wind_speed_10m_max,precipitation_sum,wave_height_max&forecast_days=7&timezone=Asia%2FBangkok`;

function toKnot(kmh){return kmh/1.852}
function fmt(n,d=1){if(n==null||isNaN(n)) return '-'; return Number(n).toFixed(d)}

function getMoonPhase(date){
  const lp = 2551443;
  const newMoon = new Date(Date.UTC(2000,0,6,18,14)).getTime()/1000;
  const now = date.getTime()/1000;
  let phase = ((now - newMoon) % lp) / lp;
  if(phase<0) phase+=1;
  const age = phase*29.53;
  const percent = (1 - Math.cos(phase*2*Math.PI))/2*100;
  const finalText = age<15 ? `ขึ้น ${Math.min(15,Math.floor(age)+1)} ค่ำ` : `แรม ${Math.min(15,Math.floor(age-14)+1)} ค่ำ`;
  return {phase, age, percent, text:finalText};
}

function drawTideChart(tideData){
  const canvas = document.getElementById('tideCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = rect.width, H = rect.height;
  ctx.clearRect(0,0,W,H);
  if(!tideData || !tideData.length){ 
    ctx.fillStyle='#334155'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('ไม่มีข้อมูลน้ำขึ้นน้ำลง', W/2, H/2);
    return;
  }
  const vals = tideData.map(d=>d.v);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV-minV || 1;
  ctx.beginPath();
  tideData.forEach((p,i)=>{
    const x = (i/(tideData.length-1))*W;
    const y = H - 12 - ((p.v-minV)/range)*(H-28);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#22d3ee'; ctx.lineWidth=2; ctx.stroke();
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(34,211,238,0.35)'); grad.addColorStop(1,'rgba(239,68,68,0.15)');
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
}

function renderTideTimes(tideData){
  if(!tideData || !tideData.length){ document.getElementById('tideTimes').innerHTML=''; return; }
  const labels = tideData.filter((_,i)=> i%4===0).slice(0,6);
  document.getElementById('tideTimes').innerHTML = labels.map(d=> `<span>${String(d.h).padStart(2,'0')}:00</span>`).join('');
  const peaks=[];
  for(let i=1;i<tideData.length-1;i++){
    if(tideData[i].v > tideData[i-1].v && tideData[i].v > tideData[i+1].v) peaks.push({...tideData[i], type:'high'});
    if(tideData[i].v < tideData[i-1].v && tideData[i].v < tideData[i+1].v) peaks.push({...tideData[i], type:'low'});
  }
  const high = peaks.filter(p=>p.type==='high')[0];
  const low = peaks.filter(p=>p.type==='low')[0];
  let statsHtml='';
  if(high) statsHtml+=`<div class="tide-stat"><span>น้ำขึ้นสูงสุด</span><b class="high">${fmt(high.v,2)}ม. ${String(high.h).padStart(2,'0')}:${String(high.m).padStart(2,'0')}</b></div>`;
  if(low) statsHtml+=`<div class="tide-stat"><span>น้ำลงต่ำสุด</span><b class="low">${fmt(low.v,2)}ม. ${String(low.h).padStart(2,'0')}:${String(low.m).padStart(2,'0')}</b></div>`;
  if(!high && !low && tideData[0]) statsHtml=`<div class="tide-stat"><span>ระดับน้ำเฉลี่ย</span><b>${fmt(tideData[0].v,2)}ม.</b></div>`;
  document.getElementById('tideStats').innerHTML = statsHtml;
}

// FIXED TOGGLE - ใช้ event delegation
function setupToggle(){
  document.getElementById('days').addEventListener('click', function(e){
    const head = e.target.closest('.day-head');
    if(!head) return;
    const day = head.closest('.day');
    if(!day) return;
    e.preventDefault();
    e.stopPropagation();
    day.classList.toggle('open');
  });
}

async function loadAll(){
  try{
    const [wRes, tRes] = await Promise.allSettled([fetch(WEATHER_API), fetch(TIDE_API)]);
    let wData=null, tideRaw=null;
    if(wRes.status==='fulfilled') wData = await wRes.value.json();
    if(tRes.status==='fulfilled'){ try{ tideRaw = await tRes.value.json(); }catch(e){} }

    const now=new Date();
    document.getElementById('htime').innerHTML = now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+'<br>'+now.toLocaleDateString('th-TH',{day:'2-digit',month:'short'});

    // tide data for wave fallback
    let waveByHour={};
    if(tideRaw && tideRaw.hourly && tideRaw.hourly.wave_height){
      tideRaw.hourly.time.forEach((t,i)=>{ waveByHour[t] = tideRaw.hourly.wave_height[i]; });
    }

    if(wData){
      const hourly=wData.hourly, daily=wData.daily;
      document.getElementById('top3').innerHTML = `
        <div class="card"><div class="lbl">💨 ลม</div><div class="val wind">${fmt(toKnot(daily.wind_speed_10m_max[0]),0)} <span style="font-size:11px">น็อต</span></div><div class="sub">แรงสุดวันนี้</div></div>
        <div class="card"><div class="lbl">🌊 คลื่น</div><div class="val wave">${fmt(daily.wave_height_max[0],1)} <span style="font-size:11px">ม.</span></div><div class="sub">สูงสุดวันนี้</div></div>
        <div class="card"><div class="lbl">🌧️ ฝน</div><div class="val rain">${fmt(daily.precipitation_sum[0],1)} <span style="font-size:11px">มม.</span></div><div class="sub">รวมวันนี้</div></div>`;
      let htmlDays='';
      for(let d=0;d<7;d++){
        const dateStr=daily.time[d]; const dateObj=new Date(dateStr);
        const dayName=d==0?'วันนี้':d==1?'พรุ่งนี้':dateObj.toLocaleDateString('th-TH',{weekday:'long'});
        const dateLabel=dateObj.toLocaleDateString('th-TH',{day:'2-digit',month:'short'});
        const dWind=fmt(toKnot(daily.wind_speed_10m_max[d]),0), dWave=fmt(daily.wave_height_max[d],1), dRain=fmt(daily.precipitation_sum[d],1);
        const isOpen=d===0?'open':''; // เปิดแค่วันแรก
        let slotsHtml='';
        for(let h of [1,4,7,10,13,16,19,22]){
          const idx=hourly.time.findIndex(t=> t.startsWith(dateStr) && new Date(t).getHours()===h);
          if(idx===-1) continue;
          const ws=toKnot(hourly.wind_speed_10m[idx]), wd=hourly.wind_direction_10m[idx], pr=hourly.precipitation[idx];
          let wh = hourly.wave_height ? hourly.wave_height[idx] : null;
          if((wh===null || isNaN(wh)) && waveByHour[hourly.time[idx]]) wh = waveByHour[hourly.time[idx]];
          const cls=ws>=15?'danger':ws>=12?'warn':'';
          const rainBadge=pr>0.2?`<span class="badge b-rain">${fmt(pr,1)}มม.</span>`:`<span class="badge b-dry">-</span>`;
          const waveText = wh!=null && !isNaN(wh) ? `🌊 ${fmt(wh,1)}ม.` : `🌊 -ม.`;
          slotsHtml+=`<div class="row ${cls}"><div class="t">${String(h).padStart(2,'0')}<small>น.</small></div><div class="arrow" style="transform:rotate(${wd}deg)">↗️</div><div class="kt">${fmt(ws,1)}<span style="font-size:10px"> kt</span></div><div class="wv">${waveText}</div><div class="rn">${rainBadge}</div></div>`;
        }
        htmlDays+=`<div class="day ${isOpen}"><div class="day-head"><b>${dayName} ${dateLabel}</b><div class="pills"><span class="pill">${dWind} kt</span><span class="pill">${dWave}ม.</span><span class="pill">${dRain}มม.</span><span class="chevron">▼</span></div></div><div class="slots">${slotsHtml}</div></div>`;
      }
      document.getElementById('days').innerHTML=htmlDays;
    }

    let tideData=null;
    if(tideRaw && tideRaw.hourly && tideRaw.hourly.sea_level_height_msl){
      const times=tideRaw.hourly.time, vals=tideRaw.hourly.sea_level_height_msl;
      tideData = times.slice(0,24).map((t,i)=>{ const d=new Date(t); return {t, v:vals[i], h:d.getHours(), m:d.getMinutes()}; });
    }
    if(tideData){ drawTideChart(tideData); renderTideTimes(tideData); }
    else {
      document.getElementById('tideTimes').innerHTML='<span style="color:#475569">ไม่มีข้อมูลน้ำขึ้นน้ำลง</span>';
      document.getElementById('tideStats').innerHTML='';
    }

    const moon = getMoonPhase(now);
    document.getElementById('moonText').textContent = moon.text;
    document.getElementById('moonPercent').textContent = fmt(moon.percent,0)+'%';
    document.getElementById('moonSub').textContent = `อายุ ${fmt(moon.age,1)} วัน • ${moon.age<15?'ข้างขึ้น':'ข้างแรม'}`;
    const icon = document.getElementById('moonIcon');
    const shadowPos = moon.phase<0.5 ? (moon.phase*100) : ((1-moon.phase)*100);
    icon.innerHTML = `<div style="position:absolute;top:0;left:${moon.phase<0.5? (50 - shadowPos)+'%': '0'};width:${100-shadowPos*1.2}%;height:100%;background:#0f1a32;border-radius:${moon.phase<0.5?'0 50% 50% 0':'50% 0 0 50%'};opacity:0.85"></div>`;

  }catch(e){
    document.getElementById('days').innerHTML=`<div class="loading">❌ ${e.message}</div>`;
  }
}

setupToggle();
loadAll();
</script>
