<script>
function toggleDay(el){ el.parentElement.classList.toggle('open'); }

// ข้อมูลจริงจาก khaophuket.com 13 ต.ค. 2026
const TIDE=[3.3,3.0,2.5,1.8,1.3,0.9,0.9,1.2,1.6,2.2,2.7,3.0,3.0,2.8,2.4,1.9,1.4,1.0,1.0,1.2,1.7,2.3,2.8,3.2];

function drawTideGraph(){
  const canvas=document.getElementById('tideCanvas');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr; canvas.height=180*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const W=rect.width, H=180, padL=45, padR=10, padT=15, padB=20;
  const min=Math.min(...TIDE)-0.4, max=Math.max(...TIDE)+0.4, range=max-min;
  ctx.clearRect(0,0,W,H);
  // grid + labels
  ctx.strokeStyle='#162040'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){let y=padT+i*(H-padT-padB)/4; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.fillStyle='#64748b'; ctx.font='11px sans-serif'; ctx.fillText((max-i*range/4).toFixed(1)+'ม.',2,y+3);}
  // smooth line
  const points=TIDE.map((v,i)=>({x:padL+i*(W-padL-padR)/23, y:padT+(max-v)/range*(H-padT-padB)}));
  ctx.beginPath(); ctx.strokeStyle='#10b981'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++){const xc=(points[i-1].x+points[i].x)/2; const yc=(points[i-1].y+points[i].y)/2; ctx.quadraticCurveTo(points[i-1].x,points[i-1].y,xc,yc);}
  ctx.lineTo(points[23].x,points[23].y); ctx.stroke();
  // fill
  ctx.lineTo(W-padR,H-padB); ctx.lineTo(padL,H-padB); ctx.closePath(); ctx.fillStyle='rgba(16,185,129,0.18)'; ctx.fill();
  // dots
  [0,5,11,17,23].forEach(i=>{const p=points[i]; ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fillStyle=i==11||i==0||i==23?'#38bdf8':'#fbbf24'; ctx.fill(); ctx.strokeStyle='#060e26'; ctx.lineWidth=2; ctx.stroke();});
}

  <div class="tide-row"><span>🔻 17:00-18:00 ลงเย็นสุด ${TIDE[17]}ม. (17:41=0.
